<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#27170e">
  <meta name="description" content="Атлас Познания — интерактивный кабинет исследователя">
  <title>Атлас Познания — Кабинет Исследователя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Literata:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wood-grain" aria-hidden="true"></div>
  <main class="desktop-frame">
    <div class="side-ornament left-ornament" aria-hidden="true"><span>✧</span><i></i><span>❧</span></div>
    <section class="app-stage" aria-label="Атлас Познания">
      <div class="screen-wrap" id="screenWrap">
        <img class="screen-image" id="screenImage" alt="Главная страница Атласа Познания — кабинет исследователя">
        <div class="loading-status" id="loadingStatus">Открываем Атлас Познания…</div>
        <div class="hotspots" id="hotspots" aria-label="Интерактивные элементы страницы"></div>
      </div>
    </section>
    <div class="side-ornament right-ornament" aria-hidden="true"><span>✥</span><i></i><span>✧</span></div>
  </main>

  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Навигация">
    <div class="drawer-head"><span>Кабинет Исследователя</span><button id="closeDrawer" aria-label="Закрыть меню">×</button></div>
    <div class="drawer-caption">КАРТА ЗНАНИЙ</div>
    <button data-page="home">⌂ <span>Главная</span></button>
    <button data-page="map">⌘ <span>Карта исследований</span></button>
    <div class="drawer-caption">НАПРАВЛЕНИЯ</div>
    <button data-page="tarot">♧ <span>Таро</span></button>
    <button data-page="astrology">☉ <span>Астрология</span></button>
    <button data-page="psychology">❋ <span>Психология</span></button>
    <button data-page="profiling">◎ <span>Профайлинг</span></button>
    <button data-page="nlp">☷ <span>NLP</span></button>
    <button data-page="numerology">123 <span>Нумерология</span></button>
    <button data-page="dreams">☾ <span>Сновидения</span></button>
    <button data-page="lab">⚗ <span>Лаборатория</span></button>
    <div class="drawer-caption">СООБЩЕСТВО</div>
    <button data-page="arena">⚔ <span>Арена Знаний</span></button>
    <button data-page="themes">☼ <span>Темы оформления</span></button>
    <div class="drawer-foot">«Познай себя — и открой новые миры»</div>
  </aside>

  <section class="modal-backdrop" id="modalBackdrop" role="presentation" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
      <div class="modal-flourish">✧</div>
      <h2 id="modalTitle">Раздел</h2>
      <div id="modalBody"></div>
    </div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
