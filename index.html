<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211812"><meta name="description" content="Атлас Познания — кабинет исследователя">
<title>Атлас Познания — Кабинет Исследователя</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Literata:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage"><main class="device" aria-label="Атлас Познания">
  <div class="loading" id="loading"><div class="loading-mark">✧</div><b>Атлас Познания</b><span>Подготавливаем кабинет исследователя…</span></div>
  <div id="screens" class="screens" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="Закрыть">×</button><div class="modal-ornament">✧</div><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="modal-action" id="modalOk">Понятно</button></section></div>
  <div class="error" id="error" hidden><b>Не удалось загрузить изображения</b><p id="errorText">Проверь подключение и обнови страницу.</p></div>
</main></div>
<script src="app.js"></script>
</body></html>
